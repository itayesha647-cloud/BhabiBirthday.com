<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Just For You 🎈</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    font-family: Georgia, serif;
    background: linear-gradient(
        135deg,
        #080608,
        #3b0719,
        #160810,
        #570d27
    );
    color: white;
    text-align: center;
}

.scene {
    position: relative;
    min-height: 100vh;
    width: 100%;
    overflow: hidden;
}

.heading {
    position: relative;
    z-index: 2;
    padding: 28px 12px 0;
}

.heading h1 {
    color: #f7d887;
    font-size: clamp(23px, 5vw, 38px);
    letter-spacing: 3px;
    text-shadow: 0 0 15px #dba94c;
    margin-bottom: 12px;
}

.heading p {
    color: #f6c9d7;
    font-size: 15px;
}

#counter {
    color: #f7d887;
    font-size: 14px;
    margin-top: 12px;
}

.balloon {
    position: absolute;
    width: clamp(42px, 8vw, 65px);
    height: clamp(55px, 10vw, 82px);
    border-radius: 50% 50% 45% 45%;
    cursor: pointer;
    z-index: 1;
    box-shadow:
        inset -8px -8px 14px rgba(0, 0, 0, 0.25),
        inset 8px 8px 12px rgba(255, 255, 255, 0.17),
        0 0 12px rgba(255, 160, 190, 0.12);
    animation: floatAround var(--duration) ease-in-out infinite;
    animation-delay: var(--delay);
    transform-origin: center bottom;
    -webkit-tap-highlight-color: transparent;
}

.balloon::before {
    content: "";
    position: absolute;
    width: 9px;
    height: 12px;
    background: inherit;
    bottom: -5px;
    left: 50%;
    transform: translateX(-50%) rotate(45deg);
    border-radius: 2px;
}

.balloon::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 100%;
    width: 1px;
    height: 55px;
    background: rgba(255, 225, 235, 0.7);
}

.balloon.popping {
    animation: pop 0.25s ease-out forwards;
    pointer-events: none;
}

@keyframes floatAround {
    0%, 100% {
        transform: translateY(0) rotate(-3deg);
    }
    25% {
        transform: translateY(-7px) rotate(2deg);
    }
    50% {
        transform: translateY(-13px) rotate(-2deg);
    }
    75% {
        transform: translateY(-6px) rotate(3deg);
    }
}

@keyframes pop {
    0% {
        transform: scale(1);
        opacity: 1;
    }
    100% {
        transform: scale(1.5);
        opacity: 0;
    }
}

.sparkle {
    position: absolute;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: #ffe8a3;
    box-shadow: 0 0 8px #ffe8a3;
    animation: twinkle 2s ease-in-out infinite alternate;
    pointer-events: none;
}

@keyframes twinkle {
    from {
        opacity: 0.15;
        transform: scale(0.7);
    }
    to {
        opacity: 1;
        transform: scale(1.5);
    }
}

.final-message {
    display: none;
    position: absolute;
    z-index: 5;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 90%;
    max-width: 500px;
    padding: 25px 15px;
    animation: appear 1s ease forwards;
}

.final-message h2 {
    color: #f7d887;
    font-size: clamp(34px, 8vw, 55px);
    text-shadow: 0 0 18px #d6a53f;
    margin-bottom: 18px;
    animation: goldenGlow 2s ease-in-out infinite alternate;
}

.final-message p {
    color: #f8d5df;
    font-size: clamp(15px, 4vw, 19px);
    line-height: 1.6;
}

.final-message button {
    margin-top: 22px;
    padding: 13px 30px;
    border: 1px solid #f7d887;
    border-radius: 30px;
    background: linear-gradient(135deg, #f5d98d, #c79535);
    color: #320b1a;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    box-shadow: 0 0 18px rgba(247, 216, 135, 0.3);
}

.final-message button:hover {
    transform: scale(1.05);
}

@keyframes goldenGlow {
    from {
        text-shadow: 0 0 8px #d6a53f;
    }
    to {
        text-shadow: 0 0 25px #f7d887, 0 0 35px #b77928;
    }
}

@keyframes appear {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

@media (max-width: 480px) {
    .heading {
        padding-top: 20px;
    }

    .heading h1 {
        letter-spacing: 2px;
    }

    .balloon::after {
        height: 35px;
    }
}
</style>
</head>

<body>

<div class="scene" id="scene">

    <div class="heading" id="heading">
        <h1>A LITTLE SURPRISE 🎈</h1>
        <p>Tap each balloon and watch the magic!</p>
        <div id="counter">Balloons left: 18</div>
    </div>

    <div class="final-message" id="finalMessage">
        <h2>Just For You ✨</h2>
        <p>A little surprise, made with love 💗</p>
        <button onclick="window.location.href='page5.html'">
            Click Here ✨
        </button>
    </div>

</div>

<script>
const scene = document.getElementById("scene");
const counter = document.getElementById("counter");
const heading = document.getElementById("heading");
const finalMessage = document.getElementById("finalMessage");

const totalBalloons = 18;
let poppedBalloons = 0;

const colors = [
    "#720b25",
    "#a30d32",
    "#17131a",
    "#c21845",
    "#8b1e3f",
    "#d63d65",
    "#4c1028",
    "#ed6685",
    "#241c2b",
    "#b51e49",
    "#7b2848",
    "#e6a0b4"
];

// Create background sparkles
for (let i = 0; i < 24; i++) {
    const sparkle = document.createElement("div");
    sparkle.className = "sparkle";
    sparkle.style.left = Math.random() * 100 + "%";
    sparkle.style.top = Math.random() * 100 + "%";
    sparkle.style.animationDelay = Math.random() * 2 + "s";
    scene.appendChild(sparkle);
}

// Create balloons
for (let i = 0; i < totalBalloons; i++) {
    const balloon = document.createElement("div");
    balloon.className = "balloon";

    balloon.style.backgroundColor =
        colors[i % colors.length];

    // Each balloon gets a fixed position
    balloon.style.left = (3 + Math.random() * 88) + "%";
    balloon.style.top = (20 + Math.random() * 65) + "%";

    // Only gentle up-and-down movement
    balloon.style.setProperty(
        "--duration",
        (3 + Math.random() * 4) + "s"
    );

    balloon.style.setProperty(
        "--delay",
        (Math.random() * -4) + "s"
    );

    balloon.addEventListener("click", function () {
        if (balloon.classList.contains("popping")) {
            return;
        }

        balloon.classList.add("popping");
        poppedBalloons++;

        counter.textContent =
            "Balloons left: " +
            (totalBalloons - poppedBalloons);

        setTimeout(function () {
            balloon.remove();

            if (poppedBalloons === totalBalloons) {
                showFinalMessage();
            }
         }, 250);
    });

    scene.appendChild(balloon);
}

function showFinalMessage() {
    heading.style.display = "none";
    counter.style.display = "none";
    finalMessage.style.display = "block";
}
</script>

</body>
</html>
