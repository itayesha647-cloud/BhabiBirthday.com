<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>A Little Surprise For You</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            overflow: hidden;
            font-family: Georgia, serif;

            background: linear-gradient(
                to bottom,
                #350810 0%,
                #5b1726 30%,
                #914b5b 65%,
                #f1dfe3 100%
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 25px;
            width: 100%;
            max-width: 500px;

            animation: fadeIn 2s ease;
        }

        .dp {
            width: 150px;
            height: 150px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #d8b56a;

            box-shadow: 0 0 20px rgba(255, 215, 140, 0.3);

            margin-bottom: 35px;

            animation: glow 3s infinite alternate;
        }

        h1 {
            color: #f5d58a;
            font-size: clamp(27px, 7vw, 38px);
            font-weight: normal;
            line-height: 1.5;

            text-shadow: 0 0 15px rgba(255, 215, 140, 0.4);

            margin-bottom: 40px;
        }

        .continue-btn {
            display: inline-block;
            padding: 14px 38px;

            color: #f9e5b0;
            background: rgba(65, 12, 27, 0.65);

            border: 1px solid #d8b56a;
            border-radius: 30px;

            font-size: 17px;
            letter-spacing: 2px;
            text-decoration: none;

            transition: 0.4s;
        }

        .continue-btn:hover {
            background: #d8b56a;
            color: #40101b;

            box-shadow: 0 0 25px rgba(255, 215, 140, 0.45);

            transform: translateY(-3px);
        }

        .star {
            position: absolute;
            color: #ffe9b0;
            font-size: 15px;

            animation: twinkle 2s infinite alternate;
            pointer-events: none;
        }

        .star:nth-child(1) {
            top: 12%;
            left: 15%;
        }

        .star:nth-child(2) {
            top: 23%;
            right: 13%;
            animation-delay: 1s;
        }

        .star:nth-child(3) {
            top: 45%;
            left: 8%;
            animation-delay: 0.7s;
        }

        .star:nth-child(4) {
            top: 65%;
            right: 10%;
            animation-delay: 1.4s;
        }

        .star:nth-child(5) {
            bottom: 13%;
            left: 22%;
            animation-delay: 0.5s;
        }

        .star:nth-child(6) {
            bottom: 20%;
            right: 25%;
            animation-delay: 1.2s;
        }

        .star:nth-child(7) {
            top: 10%;
            right: 35%;
            animation-delay: 0.8s;
        }

        @keyframes twinkle {
            from {
                opacity: 0.25;
                transform: scale(0.7);
            }

            to {
                opacity: 1;
                transform: scale(1.3);
            }
        }

        @keyframes glow {
            from {
                box-shadow: 0 0 12px rgba(255, 215, 140, 0.2);
            }

            to {
                box-shadow: 0 0 28px rgba(255, 215, 140, 0.5);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(15px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 480px) {
            .dp {
                width: 125px;
                height: 125px;
                margin-bottom: 30px;
            }

            h1 {
                margin-bottom: 35px;
            }
        }
    </style>
</head>

<body>

    <div class="star">✦</div>
    <div class="star">✧</div>
    <div class="star">✦</div>
    <div class="star">✧</div>
    <div class="star">✦</div>
    <div class="star">✧</div>
    <div class="star">✦</div>

    <div class="container">

        <img src="dp.jpg" alt="Profile Picture" class="dp">

        <h1>
            A Little Surprise<br>
            For You
        </h1>

        <a href="page2.html" class="continue-btn">
            Continue ✨
        </a>

    </div>

</body>
</html>
