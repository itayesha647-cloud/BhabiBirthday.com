
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Your Special Day ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    text-align: center;
    font-family: Georgia, serif;
    background: linear-gradient(
        to bottom,
        #30050f,
        #64182d,
        #a45d72,
        #f0dce2
    );
}

.container {
    width: 100%;
    padding: 20px;
}

.heart {
    position: relative;
    width: 280px;
    height: 260px;
    margin: 0 auto 15px;
}

.dot {
    position: absolute;
    width: 5px;
    height: 5px;
    background: #ff173d;
    border-radius: 50%;
    box-shadow: 0 0 7px #ff1744;
    animation: sparkle 1.5s infinite alternate;
}

@keyframes sparkle {
    from {
        opacity: 0.45;
        transform: scale(0.7);
    }
    to {
        opacity: 1;
        transform: scale(1.3);
    }
}

h1 {
    margin-top: 10px;
    color: #f5d47a;
    font-size: clamp(28px, 7vw, 38px);
    letter-spacing: 2px;
    text-shadow: 0 0 12px #b88632;
    animation: glow 2s infinite alternate;
}

@keyframes glow {
    from {
        text-shadow: 0 0 5px #b88632;
    }
    to {
        text-shadow: 0 0 18px #ffdf85;
    }
}

button {
    margin-top: 15px;
    padding: 12px 30px;
    border: 1px solid #f5d47a;
    border-radius: 30px;
    background: linear-gradient(45deg, #6b1028, #a83250);
    color: #ffe6a0;
    font-family: Georgia, serif;
    font-size: 16px;
    cursor: pointer;
    box-shadow: 0 0 12px #8f2948;
    transition: transform 0.3s ease;
}

button:hover {
    transform: scale(1.06);
}

@media (max-width: 400px) {
    .heart {
        transform: scale(0.88);
        margin-bottom: -5px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="heart" id="heart"></div>

    <h1>Your Special Day</h1>

    <!-- The only button on this page -->
    <button onclick="window.location.href='page4.html'">
        Continue ✨
    </button>

</div>

<script>
const heart = document.getElementById("heart");

const width = 280;
const height = 260;

for (let y = -1.3; y <= 1.3; y += 0.075) {
    for (let x = -1.5; x <= 1.5; x += 0.065) {

        const formula =
            Math.pow(x * x + y * y - 1, 3) -
            x * x * y * y * y;

        if (formula <= 0) {
            const dot = document.createElement("span");
            dot.className = "dot";

            dot.style.left =
                ((x + 1.5) / 3 * width) + "px";

            dot.style.top =
                ((1.3 - y) / 2.6 * height) + "px";

            dot.style.animationDelay =
                (Math.random() * 2) + "s";

            heart.appendChild(dot);
        }
    }
}
</script>

</body>
</html>
